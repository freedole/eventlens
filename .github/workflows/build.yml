name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else { $v = "0.1.0-ci.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (single-file, self-contained)
        run: >
          dotnet publish src/EventLens/EventLens.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ steps.ver.outputs.version }} -o out

      - name: Zip + SHA256
        shell: pwsh
        run: |
          $zip = "EventLens-${{ steps.ver.outputs.version }}-win-x64.zip"
          Compress-Archive -Path out/EventLens.exe -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$h  $zip" | Out-File SHA256SUMS.txt -Encoding ascii
          Get-ChildItem out, $zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: EventLens-${{ steps.ver.outputs.version }}
          path: |
            out/EventLens.exe
            SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EventLens-*.zip
            SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
